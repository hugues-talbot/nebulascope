# French edition — a standalone Quarto book project (a profile of the parent
# project would MERGE chapter lists rather than replace them). Renders into
# ../_book/fr so the deployed site serves it under /fr/. Developer chapters and
# build guides stay in the English edition only; the preface says so.
project:
  type: book
  output-dir: ../_book/fr

lang: fr

book:
  title: "NebulaScope"
  subtitle: "Inspecteur d'images astronomiques — Manuel de l'utilisateur"
  author: "Hugues Talbot"
  date: today
  output-file: NebulaScope-fr
  site-url: https://hugues-talbot.github.io/nebulascope/fr/
  repo-url: https://github.com/hugues-talbot/nebulascope
  repo-actions: [issue]
  sidebar:
    tools:
      - icon: translate
        text: "English edition"
        href: ../index.html
  chapters:
    - index.qmd
    - MANUAL.md
    - TRANSPORT.md
    - references.qmd

bibliography: ../references.bib
nocite: |
  @*

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: false
    css: web.css
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    toc: true
    toc-depth: 2
    number-sections: false
    colorlinks: true
    fig-align: center
    include-in-header:
      text: |
        % UI screenshots are dark-themed: a thin frame separates them from
        % the white page.
        \usepackage{float}
        \let\origincludegraphics\includegraphics
        \renewcommand{\includegraphics}[2][]{\fbox{\origincludegraphics[#1]{#2}}}
        \setlength{\fboxsep}{0pt}
        \setlength{\fboxrule}{0.4pt}
