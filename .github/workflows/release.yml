name: Release

# Fires on version tags (v0.72, v1.0, ...). Rebuilds nothing itself: it waits
# for the three platform build workflows on the same commit to succeed, then
# downloads their artifacts and attaches them to a GitHub Release.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write      # needed to create the release
  actions: read        # needed to read artifacts from other workflow runs

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for platform builds on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: "(windows|linux|macos)"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success

      # ---- Documentation PDF (Quarto book) ----------------------------------
      # Rendered fresh so the appendix includes THIS release's notes. Every
      # step is continue-on-error: a docs hiccup must never block binaries.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: make-releases.sh reads the tags

      - name: Set up Quarto + TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          tinytex: true

      # actions/checkout peels annotated tags to lightweight ones; on those,
      # %(contents:body) falls through to the COMMIT message — which would
      # put the wrong text in the release body and the PDF appendix. Refetch
      # the real tag objects first.
      - name: Restore annotated tag objects
        run: git fetch --force --tags origin

      - name: Render documentation PDF
        continue-on-error: true
        run: |
          ./docs/make-releases.sh
          (cd docs && quarto render --to pdf)
          (cd docs/fr && quarto render --to pdf)
          mkdir -p artifacts
          cp docs/_book/NebulaScope.pdf "artifacts/NebulaScope-docs-${{ github.ref_name }}.pdf" || true
          cp docs/_book/fr/NebulaScope-fr.pdf "artifacts/NebulaScope-docs-fr-${{ github.ref_name }}.pdf" || true

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: windows.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          path: artifacts

      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: linux.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          path: artifacts

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: macos.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          path: artifacts

      - name: Zip the unpacked artifacts
        run: |
          cd artifacts
          ls -R
          # Each artifact lands as a directory; zip the two that aren't already zips.
          [ -d NebulaScope-windows-x64 ] && (cd NebulaScope-windows-x64 && zip -r ../NebulaScope-windows-x64.zip .)
          [ -d NebulaScope-linux-x64 ]   && mv NebulaScope-linux-x64/NebulaScope/*.deb . 2>/dev/null || true
          [ -d NebulaScope-linux-x64 ]   && (cd NebulaScope-linux-x64   && zip -r ../NebulaScope-linux-x64.zip .)
          # macOS artifact already contains NebulaScope-macos-arm64.zip — lift it out.
          [ -d NebulaScope-macos-arm64 ] && mv NebulaScope-macos-arm64/*.zip . || true

      # The release notes live ONCE, in the annotated tag message (the same
      # source docs/make-releases.sh renders into the manual's appendix):
      # tag body first, then the asset table.
      - name: Compose release body from the tag annotation
        run: |
          git tag -l "${{ github.ref_name }}" --format='%(contents:body)' > release_body.md
          echo '' >> release_body.md
          printf '%s\n' \
            '| Platform | File | Notes |' \
            '|---|---|---|' \
            '| macOS (Apple Silicon) | `NebulaScope-macos-arm64.zip` | Unsigned — right-click ▸ Open on first launch |' \
            '| Windows (x64) | `NebulaScope-windows-x64.zip` | Unzip and run `nebulascope.exe` |' \
            '| Linux (x64) | `NebulaScope-linux-x64.zip` | Needs system Qt6/cfitsio/ccfits — see `run.sh` |' \
            '| Ubuntu/Debian | `nebulascope_*_amd64.deb` | `sudo apt install ./nebulascope_*.deb` (deps auto-resolved) |' \
            '| Documentation | `NebulaScope-docs-*.pdf` | Manual + architecture + build guides + release notes |' \
            '| Documentation (français) | `NebulaScope-docs-fr-*.pdf` | Manuel de l'"'"'utilisateur + transport de couleurs |' \
            >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NebulaScope ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body_path: release_body.md
          files: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.pdf

      # softprops keeps the OLD body when the release already exists (tag
      # re-pushed after amending its notes) — force the body to match the tag.
      - name: Sync release body to the tag notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --notes-file release_body.md
