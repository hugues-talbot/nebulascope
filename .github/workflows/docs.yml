name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Order matters: the English render cleans docs/_book, so the French
      # edition (which nests into _book/fr) must render second.
      - name: Render HTML book (English)
        run: quarto render docs --to html

      - name: Render HTML book (French)
        run: quarto render docs/fr --to html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_book
          # Manual served at https://hugues-talbot.github.io/nebulascope/
